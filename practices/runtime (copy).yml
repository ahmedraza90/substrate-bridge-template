2. Is it necessary to call the macro just before Test?
Yes, it is necessary.

Why?

The macro needs to know the runtime struct (Test) and the list of pallets to generate the correct enums/types.
These generated types are used everywhere in your mock runtime and tests (for dispatching calls, handling events, etc.).
If you don't use the macro, you would have to manually write all these enums/types, which is error-prone and not scalable.


1. Two things are happening

Inside mod runtime
You declare the runtime structure and the pallets that belong to it.
This is mostly declarative — you’re saying:

"I want a runtime called Test, and it has these pallets: System, MyPallet, Timestamp."

The macros expand this into a bunch of boilerplate code (enums, indexing, glue).

Outside mod runtime
You implement the traits (Config) for your runtime struct (Test).
This is where you fill in the details FRAME cannot guess for you.

Example: FRAME can’t know what type your timestamp “Moment” should be (u64? u128?), so you must tell it.